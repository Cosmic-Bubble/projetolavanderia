<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitações de Acesso</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-slate-50">


    <!-- ======================================================
         LAYOUT PRINCIPAL
    ====================================================== -->

    <div
        style="
            display: flex;
            width: 100%;
            min-height: 100vh;
            background: #f8fafc;
        ">


        <!-- ==================================================
             MENU
        ================================================== -->

        {% include '_menu.html' %}


        <!-- ==================================================
             CONTEÚDO
        ================================================== -->

        <main
            style="
                flex: 1;
                min-width: 0;
                min-height: 100vh;
                padding: 40px;
                background: #f8fafc;
                box-sizing: border-box;
            ">


            <!-- ==================================================
                 CABEÇALHO
            ================================================== -->

            <header class="mb-8">

                <h1 class="text-3xl font-bold text-slate-800">
                    Solicitações de acesso
                </h1>


                <p class="mt-2 text-sm text-slate-500">
                    Gerencie os usuários que solicitaram acesso ao sistema.
                </p>

            </header>


            <!-- ==================================================
                 SOLICITAÇÕES PENDENTES
            ================================================== -->

            <section
                class="mb-8 rounded-2xl border border-slate-200 bg-white p-7 shadow-sm">


                <div
                    class="mb-6 flex items-center justify-between">


                    <div>

                        <h2 class="text-xl font-bold text-slate-800">
                            Solicitações pendentes
                        </h2>


                        <p class="mt-1 text-sm text-slate-500">
                            Usuários aguardando aprovação.
                        </p>

                    </div>


                    <span
                        id="contador-pendentes"
                        class="flex h-10 min-w-10 items-center justify-center rounded-full bg-blue-100 px-3 text-sm font-bold text-blue-700">

                        0

                    </span>

                </div>


                <div
                    id="lista-pendentes"
                    class="space-y-4">


                    <div
                        class="py-8 text-center text-sm text-slate-500">

                        Carregando solicitações...

                    </div>

                </div>

            </section>


            <!-- ==================================================
                 HISTÓRICO
            ================================================== -->

            <section
                class="rounded-2xl border border-slate-200 bg-white p-7 shadow-sm">


                <div class="mb-6">

                    <h2 class="text-xl font-bold text-slate-800">
                        Últimas solicitações analisadas
                    </h2>


                    <p class="mt-1 text-sm text-slate-500">
                        Últimos cinco acessos aprovados ou recusados.
                    </p>

                </div>


                <div
                    id="historico-solicitacoes"
                    class="space-y-4">


                    <div
                        class="py-8 text-center text-sm text-slate-500">

                        Carregando histórico...

                    </div>

                </div>

            </section>


        </main>

    </div>


    <!-- ======================================================
         JAVASCRIPT
    ====================================================== -->

    <!-- Biblioteca de ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- JavaScript do menu -->
    <script src="{{ url_for('static', filename='js/menu.js') }}"></script>

    <!-- JavaScript das solicitações -->
    <script src="{{ url_for('static', filename='js/solicitacoes.js') }}"></script>

    <!-- Renderiza os ícones -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            if (typeof lucide !== "undefined") {
                lucide.createIcons();
            }

        });
    </script>

</body>

</html>
